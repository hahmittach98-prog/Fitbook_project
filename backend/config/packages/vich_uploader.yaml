vich_uploader:
    db_driver: orm
    mappings:
        salles:
            uri_prefix: /images/salles
            upload_destination: '%kernel.project_dir%/public/images/salles'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        users:
            uri_prefix: /images/users
            upload_destination: '%kernel.project_dir%/public/images/users'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        coachs:
            uri_prefix: /images/coachs
            upload_destination: '%kernel.project_dir%/public/images/coachs'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer